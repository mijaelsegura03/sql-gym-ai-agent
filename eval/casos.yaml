# =====================================================================
#  Conjunto de evaluación del agente (spec funcional RF-72, §7; spec técnico §9.2)
#
#  Usuarios elegidos de los datos cargados (DT-02):
#    Admin central  30123987  Romina Aguirre      administracion, sin sede (todas)
#    Admin Norte    26789012  Marcela Suárez      gerente, Sede Norte
#    Socio S1       37270609  Emiliano Juárez     activo, Sede Centro, Full Anual hasta 29/06/2027, rutina 3 días
#    Socio S2       23679921  Santiago González   apto "Evitar ejercicios de alto impacto"
#    Socio S3       22380212  Victoria Ortiz      rutina de 2 días, Full Trimestral
#
#  Los esperados de datos se calcularon sobre la base recién cargada (fecha base 16/10/2026) con la
#  consulta que figura en el comentario de cada caso, y se revisaron a mano. Los casos con fechas
#  relativas ("hoy", "este mes", "el mes pasado") tienen depende_fecha: true y valido_hasta (S-05):
#  si se evalúa después de esa fecha hay que recalcular el esperado.
#
#  Campos:
#    categoria: directa | fuera_dominio | datos | documentos | hibrida | privacidad |
#               escritura_valida | escritura_rechazada
#    ruta_esperada, herramientas_esperadas
#    accion (escritura): confirmar | cancelar | escribir_si | otro_mensaje
#    esperado:
#      filas: filas que tienen que estar en RespuestaAgente.filas (por valores, sin importar columnas ni orden)
#      total_filas: cantidad exacta de filas
#      texto_contiene / texto_no_contiene: subcadenas (sin distinguir mayúsculas ni acentos)
#      debe_contener: hechos que un juez LLM verifica en la respuesta (corrección RAG)
#      no_cubierto: true si los documentos no cubren la pregunta (el juez verifica que lo diga)
#      no_debe_contener: valores de otros socios que no pueden aparecer (privacidad)
#      rechazo: true si la respuesta tiene que ser un rechazo
#      propuesta: true/false si tiene que (o no) armarse una propuesta de cambio
#      advertencias: códigos de advertencia que la propuesta tiene que incluir
#    verificacion_db: consultas (superusuario) sobre el estado final y su resultado esperado
# =====================================================================

